<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Bili</title>
  <style>
    :root { --bg:#0b0b0f; --fg:#f5f5f7; --muted:#a1a1aa; --accent:#ffd60a; --danger:#ff453a; --ok:#32d74b; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family: system-ui, sans-serif; }
    main { min-height:100%; display:flex; flex-direction:column; gap:14px; padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); }
    h1 { margin:0; font-size:1.4rem; }
    #state { font-size:1.15rem; line-height:1.4; min-height:2em; }
    #alert { font-size:1.8rem; font-weight:700; line-height:1.25; min-height:3em; }
    #alert.p0 { color:var(--danger); }
    #alert.p1 { color:var(--accent); }
    button { font:inherit; font-size:1.2rem; font-weight:700; border:0; border-radius:16px; padding:18px 16px; color:#000; background:var(--accent); width:100%; }
    button.secondary { background:#26262e; color:var(--fg); }
    button:focus-visible { outline:4px solid #fff; outline-offset:3px; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    video { width:100%; border-radius:12px; background:#000; max-height:24vh; object-fit:cover; }
    #sectors { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; font-size:.95rem; color:var(--muted); }
    #sectors div { padding:8px; border-radius:10px; background:#17171d; text-align:center; }
    #sectors .caution { color:var(--accent); } #sectors .blocked { color:var(--danger); font-weight:700; }
    #stats { font-size:.8rem; color:var(--muted); }
    .hidden { display:none !important; }

    /* Toda la pantalla es un solo botón: no hay nada que buscar con el dedo. */
    #start, #talk { position:fixed; inset:0; width:100%; height:100%; border-radius:0; z-index:10; display:flex; align-items:flex-end; justify-content:center; padding:0 24px max(48px,env(safe-area-inset-bottom)); font-size:1.7rem; text-align:center; line-height:1.3; }
    #start { background:var(--accent); color:#000; align-items:center; padding:24px; }
    #talk { background:transparent; color:var(--fg); }
    #talk.escuchando { box-shadow: inset 0 0 0 10px var(--ok); }
    #escucha { font-size:1.6rem; font-weight:700; color:var(--ok); min-height:1.4em; }
    #nav-estado { font-size:1.15rem; line-height:1.4; min-height:2.6em; }
    #ayuda { position:relative; z-index:20; background:#13131a; border-radius:12px; padding:8px 12px; }
    #ayuda summary { font-size:.95rem; color:var(--muted); }
    #dest { width:100%; font:inherit; font-size:1.1rem; padding:12px; border-radius:12px; border:2px solid #3a3a46; background:#0b0b0f; color:var(--fg); margin:8px 0; }
  </style>
</head>
<body>
<main>
  <h1>Bili</h1>
  <p id="aviso" style="color:var(--muted);font-size:.95rem;margin:0">
    Ayuda complementaria: no reemplaza el bastón ni el perro guía. Lleve el celular con la cámara trasera hacia adelante.
  </p>
  <button id="start" aria-label="Empezar. Toque en cualquier parte de la pantalla para activar Bili.">Toque en cualquier parte para empezar</button>

  <div id="live" class="hidden">
    <details id="ayuda">
      <summary>Opciones para un acompañante</summary>
      <label for="dest" style="font-size:.95rem;color:var(--muted)">Destino escrito</label>
      <input id="dest" type="text" autocomplete="off" placeholder="Ej.: calle 72 con carrera 10" />
      <div class="row"><button id="ir">Ir</button><button id="nav-cancelar" class="secondary">Cancelar ruta</button></div>
      <div class="row" style="margin-top:10px"><button id="describe" class="secondary">Describir</button><button id="repeat" class="secondary">Repetir</button></div>
      <button id="stop" class="secondary" style="margin-top:10px">Apagar Bili</button>
    </details>
    <div id="escucha" aria-hidden="true"></div>
    <div id="state" role="status" aria-live="off">Conectando…</div>
    <div id="alert" role="alert" aria-live="assertive"></div>
    <div id="nav-estado" aria-hidden="true"></div>
    <div id="sectors" aria-hidden="true"><div id="s-left">Izq.</div><div id="s-center">Frente</div><div id="s-right">Der.</div></div>
    <video id="cam" playsinline muted aria-hidden="true"></video>
    <div id="stats" aria-hidden="true"></div>
    <button id="talk" aria-label="Hablar. Toque en cualquier parte de la pantalla para decir un destino o una orden.">Toque en cualquier parte para hablar</button>
  </div>
  <canvas id="cv" class="hidden"></canvas>
</main>

<script src="/v1/nav.js"></script>
<script src="/v1/voice.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const SEND_W = 640, JPEG_Q = 0.6, SEND_FPS = 8, MAX_BUFFERED = 250_000;
  const MAX_AGE_MS = { P0: 4000, P1: 4000, P2: 20000, P3: 10000 };
  const RANK = { P0: 0, P1: 1, P2: 2, P3: 3 };
  const RATE = Number(params.get('rate')) || 1.0;  // velocidad de la voz; antes 1.1 era demasiado rápido
  const QUIET_AFTER_SPEECH_MS = 350;               // pausa para no oír el eco de la propia voz
  let stream = null, wsFrames = null, wsEvents = null, timer = null, wake = null, running = false;
  let sent = 0, dropped = 0, lastFrame = null;

  /* ---------- Voz: cola con prioridad ---------- */
  let queue = [], speaking = null, voice = null, listening = false, currentListen = null, audioCtx = null;
  const history = [];
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /es[-_]CO/i.test(v.lang)) || vs.find(v => /es[-_](MX|US|419)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
  }
  speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

  const finish = (item) => { if (item && item.cb) { const cb = item.cb; item.cb = null; cb(); } };
  function dropWhere(pred) { queue = queue.filter(i => { if (pred(i)) { finish(i); return false; } return true; }); }

  /* cb se llama cuando el mensaje terminó de decirse, o cuando se descartó. */
  function speak(text, priority = 'P3', interruptible = true, cb = null) {
    const rank = RANK[priority] ?? 3;
    if (rank === 0) {
      dropWhere(i => i.rank !== 0);
      if (speaking && speaking.rank > 0 && speaking.interruptible) speechSynthesis.cancel();
      if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
      if (currentListen) currentListen.interrupt();  // una alerta urgente corta la escucha
    } else if (rank === 2) {
      dropWhere(i => i.rank === 2);
    }
    queue.push({ text, rank, priority, interruptible, cb, t: performance.now() });
    queue.sort((a, b) => a.rank - b.rank || a.t - b.t);
    pump();
  }
  function pump() {
    if (speaking || !queue.length) return;
    if (listening && queue[0].rank > 0) return;  // mientras la persona habla, Bili espera (solo lo urgente interrumpe)
    const item = queue.shift();
    if (performance.now() - item.t > (MAX_AGE_MS[item.priority] ?? 10000)) { finish(item); return pump(); } // ya caducó
    const u = new SpeechSynthesisUtterance(item.text);
    u.lang = voice ? voice.lang : 'es-CO'; if (voice) u.voice = voice;
    u.rate = RATE;
    speaking = item;
    history.push(item.text); if (history.length > 8) history.shift();
    u.onend = u.onerror = () => { speaking = null; finish(item); pump(); };
    speechSynthesis.speak(u);
  }
  const sayAndWait = (text, priority = 'P1') => new Promise(res => speak(text, priority, true, res));
  function interruptSoft() {  // la persona va a hablar: se calla todo lo que no sea urgente
    if (speaking && speaking.rank > 0) { speechSynthesis.cancel(); const s = speaking; speaking = null; finish(s); }
    dropWhere(i => i.rank > 0);
  }
  async function whenQuiet() {
    const t0 = performance.now();
    while ((speaking || queue.some(i => i.rank === 0)) && performance.now() - t0 < 15000) await new Promise(r => setTimeout(r, 100));
    await new Promise(r => setTimeout(r, QUIET_AFTER_SPEECH_MS));
  }
  function beep() {
    try {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; g.gain.value = 0.2;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.18);
    } catch (_) {}
  }

  /* ---------- Escucha (reconocimiento de voz). Reintenta mientras dure la ventana: iOS corta solo a los pocos segundos ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function listen(ms) {
    return new Promise(resolve => {
      if (!SR) return resolve({ error: 'unsupported' });
      const deadline = performance.now() + ms;
      let done = false, rec = null, heardSpeech = false;
      const end = (r) => {
        if (done) return; done = true;
        clearTimeout(tm); listening = false; currentListen = null;
        try { rec && rec.abort(); } catch (_) {}
        $('escucha').textContent = ''; $('talk').classList.remove('escuchando');
        resolve(r); pump();
      };
      const tm = setTimeout(() => { if (!heardSpeech) end({ silence: true }); }, ms);
      const begin = () => {
        if (done) return;
        rec = new SR(); rec.lang = 'es-CO'; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = false;
        rec.onspeechstart = () => { heardSpeech = true; };
        rec.onresult = (e) => { const t = e.results[0][0].transcript.trim(); if (t) end({ text: t }); };
        rec.onerror = (e) => {
          if (e.error === 'no-speech' || e.error === 'aborted') return;  // onend decide si hay que reintentar
          end({ error: e.error || 'error' });
        };
        rec.onend = () => { if (!done) { if (performance.now() < deadline - 1200) begin(); else end({ silence: true }); } };
        try { rec.start(); } catch (err) { end({ error: String(err) }); }
      };
      listening = true;
      currentListen = { interrupt: () => end({ interrupted: true }) };
      $('escucha').textContent = 'Escuchando…'; $('talk').classList.add('escuchando');
      begin();
    });
  }

  /* ---------- Navegación a pie ---------- */
  // ?sim=1 (o ?sim=VELOCIDAD) recorre la ruta con posiciones falsas, para probar en casa sin salir.
  const SIM = params.get('sim');
  let ruta = null, navigator_ = null, simTimer = null, dialog = null, avisoBiliDicho = false;
  let lastPos = null, posWatch = null, readyResolve = null;
  const sistemaListo = new Promise(res => { readyResolve = res; });  // el servidor dice "Sistema listo" al terminar de arrancar

  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('sin-gps'));
      navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
    });
  }
  async function pedirRuta(body) {
    const r = await fetch('/v1/rutas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) {
      let detalle = 'No pude calcular la ruta ahora.';
      try { detalle = (await r.json()).detail || detalle; } catch (_) {}
      throw new Error(typeof detalle === 'string' ? detalle : 'Revise el destino e intente de nuevo.');
    }
    return r.json();
  }
  const lugar = (s) => BiliVoice.speakable((s || '').replace(/, Colombia$/, '').replace(/, Cundinamarca/, ''));

  async function findRoute(texto) {
    try {
      let origen;
      if (SIM) origen = { lat: 4.5981, lng: -74.0760 };  // simulación: Plaza de Bolívar
      else { const pos = await getPosition(); origen = { lat: pos.coords.latitude, lng: pos.coords.longitude }; }
      const r = await pedirRuta({ origen, destino_texto: texto });
      // La advertencia fija de Bili se dice una vez por sesión; las del proveedor, siempre.
      const [fija, ...otras] = r.advertencias;
      const avisos = [...(avisoBiliDicho ? [] : [fija]), ...otras].join(' ');
      avisoBiliDicho = true;
      const larga = r.distancia_m > 3000 ? ' Es una caminata larga.' : '';
      return { ok: true, ruta: r, speech: `Encontré ${lugar(r.destino_confirmado || texto)}. ${r.resumen}.${larga} ${avisos} ¿Comienzo? Diga sí o no.` };
    } catch (err) {
      const msg = err.code === 1 ? 'No tengo permiso para usar la ubicación. Actívela en los ajustes del teléfono.'
        : err.code ? 'No pude obtener su ubicación. Salga a un lugar abierto e intente de nuevo.'
        : err.message === 'sin-gps' ? 'Este teléfono no tiene ubicación disponible.' : BiliVoice.speakable(err.message);
      return { ok: false, message: msg };
    }
  }
  /* Posición continua: sirve para el seguimiento de la ruta y para decir dónde está la persona, haya ruta o no. */
  function seguirPosicion() {
    if (SIM) { lastPos = { lat: 4.5981, lng: -74.0760, heading: null, speed: null, accuracy: 8 }; return; }
    if (!navigator.geolocation || posWatch !== null) return;
    posWatch = navigator.geolocation.watchPosition(
      (p) => {
        const c = p.coords;
        lastPos = { lat: c.latitude, lng: c.longitude, heading: c.heading, speed: c.speed, accuracy: c.accuracy };
        if (navigator_) { navigator_.update({ lat: c.latitude, lng: c.longitude, accuracy: c.accuracy, t: p.timestamp / 1000 }); finRuta(); }
      },
      () => { if (navigator_) speak('Perdí la señal de ubicación.', 'P1'); },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  }
  const finRuta = () => { if (navigator_ && navigator_.finished) { detenerSeguimiento(); if (dialog) dialog.routeEnded(); } };

  /* "Está en la Carrera 7, caminando hacia el norte. No tiene una ruta activa." — como Waze sin destino. */
  async function whereText() {
    const p = lastPos;
    if (!p) return 'Todavía no tengo su ubicación.';
    let texto;
    try {
      const r = await fetch('/v1/ubicacion', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lat: p.lat, lng: p.lng }) });
      const j = r.ok ? await r.json() : {};
      const caminando = p.heading != null && !isNaN(p.heading) && p.speed > 0.7;  // parado, el GPS no sabe hacia dónde mira
      texto = j.calle ? `Está en ${BiliVoice.speakable(j.calle)}${caminando ? `, caminando hacia el ${BiliNav.headingWord(p.heading)}` : ''}.` : 'No sé en qué calle está.';
    } catch (_) { texto = 'No pude saber en qué calle está.'; }
    return texto + (navigator_ && ruta ? ` Faltan ${BiliNav.sayDistance(navigator_.remainingM)} para llegar a su destino.` : ' No tiene una ruta activa.');
  }
  async function primeraPosicion(ms) {
    const t0 = performance.now();
    while (!lastPos && performance.now() - t0 < ms) await new Promise(r => setTimeout(r, 200));
    return !!lastPos;
  }

  function iniciarSeguimiento(r) {
    detenerSeguimiento();
    ruta = r;
    navigator_ = new BiliNav.Navigator(r, {
      say: (text, priority) => { speak(text, priority); $('nav-estado').textContent = text; },
      onOffRoute: recalcular,
    });
    if (SIM) {
      const speed = Number(SIM) > 1 ? Number(SIM) : 2;
      let along = 0;
      simTimer = setInterval(() => {
        along += 1.4 * speed;
        const p = BiliNav.positionAt(navigator_.path, along);
        lastPos = { lat: p.lat, lng: p.lng, heading: null, speed: null, accuracy: 8 };
        navigator_.update({ lat: p.lat, lng: p.lng, accuracy: 8, t: Date.now() / 1000 });
        finRuta();
      }, 1000);
    }
  }
  function detenerSeguimiento() {
    if (simTimer) clearInterval(simTimer);
    simTimer = null;
  }
  async function recalcular(pos) {
    if (SIM || !ruta) return;
    try {
      const nueva = await pedirRuta({ origen: { lat: pos.lat, lng: pos.lng }, destino: ruta.destino });
      iniciarSeguimiento(nueva);
      speak('Ruta nueva lista. ' + nueva.pasos[0].frase, 'P1');
    } catch (err) { speak('No pude recalcular la ruta. Use su bastón y pida ayuda si la necesita.', 'P1'); }
  }
  function cancelarRuta() { detenerSeguimiento(); navigator_ = null; ruta = null; $('nav-estado').textContent = ''; }

  /* ---------- Diálogo por voz ---------- */
  const env = {
    say: sayAndWait,
    listen, whenQuiet, beep,
    interrupt: interruptSoft,
    findRoute,
    startRoute: (r) => iniciarSeguimiento(r),
    cancelRoute: cancelarRuta,
    repeat: () => { const t = history[history.length - 1]; speak(t || 'No hay nada que repetir.', 'P1'); },
    describe: () => fetch('/v1/describe', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'auto', task: 'scene', speak: true }) }).catch(() => speak('No pude describir la escena.', 'P1')),
    whereText,
  };

  /* ---------- Cámara y envío de frames ---------- */
  async function openCamera() {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = $('cam'); v.srcObject = stream; await v.play();
  }
  function startSending() {
    const v = $('cam'), c = $('cv'), ctx = c.getContext('2d');
    timer = setInterval(() => {
      if (!wsFrames || wsFrames.readyState !== 1 || !v.videoWidth) return;
      if (wsFrames.bufferedAmount > MAX_BUFFERED) { dropped++; return; } // red lenta: se salta el frame, no se acumula
      c.width = SEND_W; c.height = Math.round(SEND_W * v.videoHeight / v.videoWidth);
      ctx.drawImage(v, 0, 0, c.width, c.height);
      c.toBlob(b => { if (b && wsFrames && wsFrames.readyState === 1) { wsFrames.send(b); sent++; } }, 'image/jpeg', JPEG_Q);
    }, 1000 / SEND_FPS);
  }

  /* ---------- WebSockets ---------- */
  const base = () => `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`;
  function connect() {
    if (!running) return;
    wsFrames = new WebSocket(`${base()}/ws/frames`); wsFrames.binaryType = 'arraybuffer';
    wsFrames.onclose = () => { if (running) setTimeout(connect, 1500); };
    wsEvents = new WebSocket(`${base()}/ws/events`);
    wsEvents.onopen = () => { $('state').textContent = 'Conectado.'; };
    wsEvents.onclose = () => { if (running) $('state').textContent = 'Sin conexión con el servidor. Reintentando…'; };
    wsEvents.onmessage = (m) => {
      const e = JSON.parse(m.data);
      if (e.type === 'speak') {
        if (readyResolve && /^Sistema (listo|iniciado)/.test(e.text)) readyResolve();
        speak(e.text, e.priority, e.interruptible !== false);
      }
      else if (e.type === 'alert') {
        const a = $('alert'); a.textContent = e.data.text; a.className = e.data.priority === 'P0' ? 'p0' : e.data.priority === 'P1' ? 'p1' : '';
      } else if (e.type === 'description') { $('state').textContent = e.data.text; }
      else if (e.type === 'frame') {
        lastFrame = performance.now();
        const s = e.data.navigation && e.data.navigation.sectors;
        if (s) for (const k of ['left', 'center', 'right']) if (s[k]) {
          const el = $('s-' + k); el.className = s[k].state; el.textContent = `${{left:'Izq.',center:'Frente',right:'Der.'}[k]} ${s[k].clear_m} m`;
        }
        $('stats').textContent = `${e.data.fps} fps · ${Math.round(e.data.latency_ms.total)} ms · enviados ${sent}, omitidos ${dropped}`;
      }
    };
  }
  // Si el servidor deja de contestar, la persona debe saberlo: no puede ver que la pantalla se congeló.
  setInterval(() => {
    if (running && lastFrame && performance.now() - lastFrame > 5000) {
      lastFrame = null; speak('Perdí la conexión con el servidor. Use su bastón.', 'P0');
    }
  }, 2000);

  /* ---------- Inicio y fin ---------- */
  async function start() {
    $('start').disabled = true;
    speechSynthesis.speak(new SpeechSynthesisUtterance('')); // desbloquea la voz con el gesto del usuario
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (_) {}
    if (SR) {  // calentamiento dentro del gesto: aquí iOS pide el permiso del micrófono, antes de que la persona dependa de él
      try { const w = new SR(); w.lang = 'es-CO'; w.start(); setTimeout(() => { try { w.abort(); } catch (_) {} }, 400); } catch (_) {}
    }
    try {
      await openCamera();
    } catch (err) {
      $('start').disabled = false;
      const msg = (location.protocol !== 'https:' && location.hostname !== 'localhost')
        ? 'La cámara solo funciona por HTTPS. Abra la dirección que empieza por https.' : 'No se pudo abrir la cámara. Revise el permiso.';
      $('aviso').textContent = msg; speak(msg, 'P0'); return;
    }
    running = true;
    $('start').classList.add('hidden'); $('live').classList.remove('hidden');
    try { wake = await navigator.wakeLock.request('screen'); } catch (_) {}
    connect(); startSending(); seguirPosicion();
    dialog = BiliVoice.createDialog(env);
    await sayAndWait('Bili activado.', 'P1');
    await Promise.race([sistemaListo, new Promise(r => setTimeout(r, 8000))]);  // primero el estado del sistema, después la pregunta
    if (await primeraPosicion(5000)) await sayAndWait(await whereText(), 'P1');   // dónde está, antes de preguntar adónde va
    dialog.start();  // pregunta el destino sin que haya que tocar nada
  }
  function stop() {
    running = false; clearInterval(timer);
    cancelarRuta(); if (dialog) dialog.routeEnded(); dialog = null;
    if (posWatch !== null) { navigator.geolocation.clearWatch(posWatch); posWatch = null; }
    if (currentListen) currentListen.interrupt();
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (wsFrames) wsFrames.close(); if (wsEvents) wsEvents.close();
    if (wake) wake.release().catch(() => {});
    speechSynthesis.cancel(); queue = []; speaking = null;
    $('live').classList.add('hidden'); $('start').classList.remove('hidden'); $('start').disabled = false;
    $('state').textContent = '';
  }
  document.addEventListener('visibilitychange', async () => {
    if (running && document.visibilityState === 'visible') { try { wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
  });

  $('start').addEventListener('click', start);
  $('talk').addEventListener('click', () => { if (dialog) dialog.onTap(); });
  // Opciones para un acompañante que sí ve la pantalla
  $('stop').addEventListener('click', stop);
  $('repeat').addEventListener('click', env.repeat);
  $('describe').addEventListener('click', env.describe);
  $('nav-cancelar').addEventListener('click', () => { cancelarRuta(); if (dialog) dialog.routeEnded(); speak('Ruta cancelada.', 'P1'); });
  $('ir').addEventListener('click', async () => {
    const texto = $('dest').value.trim(); if (texto.length < 3) return;
    const res = await findRoute(texto);
    if (res.ok) { iniciarSeguimiento(res.ruta); if (dialog) dialog.routeStarted(); speak(`Voy a ${lugar(res.ruta.destino_confirmado || texto)}. ${res.ruta.resumen}.`, 'P1'); }
    else speak(res.message, 'P1');
  });
})();
</script>
</body>
</html>
