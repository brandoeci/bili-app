services:
  vision-asistiva:
    build:
      context: .
      dockerfile: Dockerfile
    image: vision-asistiva:local
    container_name: vision-asistiva
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 1
      DEPTH_ENABLED: ${DEPTH_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_TIMEOUT_S: ${GEMINI_TIMEOUT_S:-20}
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
